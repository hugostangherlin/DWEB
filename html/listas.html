<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Listas ordenada e não ordenadas</title>
</head>
<body>
    <h2>Lista não ordenadas - Cores</h2>
    <ul type = "circle">
        <!-- Tipos de ul ->square, disk, circle... -->
        <li>Amarelo</li>
        <li>Azul</li>
        <li>Marrom</li>
        <li>Vermelho</li>
        <li>Verde</li>
        <li>Lilás</li>
        <li>Laranja</li>
        <li>Rosa</li>
        <li>Preto</li>
    </ul>
    <h2>jOGOS</h2>
    <ul>
        <li>XBOX</li>
        <ol type="A">
            <li>Gears 5</li>
            <li>Starfield</li>
            <li>..;</li>
        </ol>
        <li>PSN</li>
        <ol type="a">
            <li>God of War</li>
            <li>The Last Of Us</li>
            <li>AstroBot</li>
        </ol>
        <li>PC</li>
        <ol type="I">
            <li>Wukong</li>
            <li>Stela Blade</li>
            <li>..;</li>
        </ol>
    </ul>
</body>
</html>

<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulário</title>
    <style>
        body{
            font-family: Arial, Helvetica, sans-serif;
        }
        fieldset{
            width: 300px;
            margin: 0% auto;
            border-radius: 5px;
            background-color: #f8f8f8;
        }
    .botao{
        color: black;
        background-color: rgb(226, 43, 43);
        text-align: justify;
    }
    input{
        width: 80%
        padding: rigth 40px;
    }
    </style>
</head>
<body>
    <form>
        <fieldset><!-- Separa em blocos de assunto -->
            <legend>
                <h2>Formulário de Alunos</h2>
            </legend>
        <label>Nome Completo</label>
        <input type="text" name="nome" placeholder="Digite aqui"></input><br><br>

        <label>Senha</label>
        <input type="password" name="senha" placeholder="Digite aqui"></input><br><br>

        <label>Email</label>
        <input type="Email" name="Email" placeholder="Digite aqui"></input><br><br>

        <label>Matricula</label>
        <input type="number" name="Matricula" placeholder="Digite aqui"></input><br><br>

        <label>CPF</label>
        <input type="number" name="CPF" placeholder="Digite aqui"></input><br><br>

        <label>Endereço</label>
        <input type="text" name="Endereço" placeholder="Digite aqui"></input><br><br>

        <label>Data de Nascimento</label>
        <input type="date"></input><br><br>

        <label>Filhos?</label>
        <select>
            <option value="">Sim</option>
            <option value="">Não</option>
        </select>

        <button class= "botao"type="button">Enviar</button>
    </fieldset>


    </form>
</body>
</html>

<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulário</title>
    <style>
        body{
            font-family: Arial, Helvetica, sans-serif;
        }
    </style>
</head>
<body>
    <div>
        <form>
            <fieldset><!-- Separa em blocos de assunto -->
                <legend>
                    <h2>Formulário de Alunos</h2>
                </legend>
            <label>Nome Completo</label>
            <input type="text" name="nome" placeholder="Digite aqui"></input><br><br>
    
            <label>Senha</label>
            <input type="password" name="senha" placeholder="Digite aqui"></input><br><br>
    
            <label>Email</label>
            <input type="Email" name="Email" placeholder="Digite aqui"></input><br><br>
    
            <label>Matricula</label>
            <input type="number" name="Matricula" placeholder="Digite aqui"></input><br><br>
    
            <label>CPF</label>
            <input type="number" name="CPF" placeholder="Digite aqui"></input><br><br>
    
            <label>Endereço</label>
            <input type="text" name="Endereço" placeholder="Digite aqui"></input><br><br>
    
            <label>Data de Nascimento</label>
            <input type="date"></input><br><br>
    
            <label>Filhos?</label>
            <select>
                <option value="">Sim</option>
                <option value="">Não</option>
            </select>
            <button class= "botao"type="button">Enviar</button>
        </fieldset>
    
    
        </form>

    </div>
    
        <div>
            <fieldset>
                <legend>
                    <h1>Filiação</h1>
                </legend>
                <label for="Nome da Mâe:"></label>
                <input type="text" placeholder="Nome da Mãe:">
                <br><br>
    
                <label for="Nome do pai"></label>
                <input type="text" placeholder="Nome do pai:">
                <br><br>
    
                <p>Ou</p>
    
                <label for="Nome do Responsável:"></label>
                <input type="text" placeholder="Nome do Responsável:">
                <br><br>

        </div>
            <div>
                <h2>Formação Acadêmica</h2>
                <fieldset>
                    <legend>Ensino Médio</legend>
                    <label for="Nome da instituição"></label>
                    <input type="text">
                    <label for="Ano de conclusão"></label>
                    <input type="date">
                </fieldset>

                <fieldset>
                    <legend>Graduação</legend>
                    <label for="Nome da instituição"></label>
                    <input type="text">
                    <label for="Nome do curso"></label>
                    <input type="text">
                    <label for="Ano de conclusão"></label>
                    <input type="date">
                </fieldset>

                <fieldset>
                    <legend>Pós-Graduação</legend>
                    <label for="Nome da instituição"></label>
                    <input type="text">
                    <label for="Nome do curso"></label>
                    <input type="text">
                    <label for="Ano de conclusão"></label>
                    <input type="date">
                    
                </fieldset>
                
            </div>
         
        
</body>
</html>
